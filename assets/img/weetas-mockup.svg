<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="weeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081C36" />
      <stop offset="100%" stop-color="#123258" />
    </linearGradient>
    <filter id="shadowWee" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#weeGrad)" rx="16"/>
  <circle cx="520" cy="320" r="130" fill="#D4AF37" opacity="0.12" />
  <circle cx="70" cy="80" r="100" fill="#00D2FF" opacity="0.12" />

  <!-- Browser Mockup -->
  <g transform="translate(85, 45)" filter="url(#shadowWee)">
    <rect width="430" height="300" rx="14" fill="#FFFFFF" stroke="#0B192C" stroke-width="3"/>
    
    <!-- Top Bar -->
    <rect width="430" height="32" rx="14" fill="#F1F5F9"/>
    <circle cx="20" cy="16" r="5" fill="#EF4444"/>
    <circle cx="36" cy="16" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="16" r="5" fill="#10B981"/>
    
    <rect x="85" y="6" width="260" height="20" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="20" fill="#64748B" font-family="sans-serif" font-size="10">https://weetas.com</text>

    <!-- Content -->
    <g transform="translate(15, 45)">
      <!-- Real Estate Hero -->
      <rect width="400" height="95" rx="8" fill="#1E3A8A"/>
      <text x="20" y="36" fill="#FACC15" font-family="sans-serif" font-size="11" font-weight="bold">WEETAS REAL ESTATE</text>
      <text x="20" y="56" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="900">PREMIUM PROPERTIES IN BAHRAIN</text>
      <text x="20" y="74" fill="#BFDBFE" font-family="sans-serif" font-size="10">Luxury Apartments, Waterfront Villas &amp; High-Yield Investments</text>

      <!-- Property Listings Row -->
      <g transform="translate(0, 108)">
        <!-- Property 1 -->
        <g transform="translate(0, 0)">
          <rect width="126" height="125" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
          <rect x="6" y="6" width="114" height="60" rx="6" fill="#0284C7"/>
          <text x="12" y="82" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Marassi Shores</text>
          <text x="12" y="94" fill="#64748B" font-family="sans-serif" font-size="8">Diyar Al Muharraq</text>
          <text x="12" y="114" fill="#1E3A8A" font-family="sans-serif" font-size="11" font-weight="900">BD 75,000</text>
        </g>

        <!-- Property 2 -->
        <g transform="translate(137, 0)">
          <rect width="126" height="125" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
          <rect x="6" y="6" width="114" height="60" rx="6" fill="#0F766E"/>
          <text x="12" y="82" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Amwaj Marina Villa</text>
          <text x="12" y="94" fill="#64748B" font-family="sans-serif" font-size="8">Amwaj Islands</text>
          <text x="12" y="114" fill="#1E3A8A" font-family="sans-serif" font-size="11" font-weight="900">BD 190,000</text>
        </g>

        <!-- Property 3 -->
        <g transform="translate(274, 0)">
          <rect width="126" height="125" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
          <rect x="6" y="6" width="114" height="60" rx="6" fill="#4338CA"/>
          <text x="12" y="82" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Seef Panoramic Flat</text>
          <text x="12" y="94" fill="#64748B" font-family="sans-serif" font-size="8">Seef District</text>
          <text x="12" y="114" fill="#1E3A8A" font-family="sans-serif" font-size="11" font-weight="900">BD 58,000</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(415, 20)" filter="url(#shadowWee)">
    <rect width="150" height="38" rx="19" fill="#1E3A8A" stroke="#FACC15" stroke-width="2"/>
    <text x="75" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">REAL ESTATE PORTAL</text>
  </g>
</svg>