<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="calcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <filter id="shadowC" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#calcGrad)" rx="16"/>
  <circle cx="500" cy="300" r="160" fill="#3A86FF" opacity="0.12" />

  <!-- Code / Matrix lines background decoration -->
  <g opacity="0.08" fill="none" stroke="#FFFFFF" stroke-width="1.5">
    <path d="M 50 80 H 550 M 50 140 H 550 M 50 200 H 550 M 50 260 H 550 M 50 320 H 550" />
    <path d="M 120 40 V 360 M 240 40 V 360 M 360 40 V 360 M 480 40 V 360" />
  </g>

  <!-- Device Frame Mockup -->
  <g transform="translate(195, 45)" filter="url(#shadowC)">
    <rect width="210" height="320" rx="26" fill="#111827" stroke="#00D2FF" stroke-width="3"/>
    
    <!-- Screen -->
    <rect x="12" y="20" width="186" height="280" rx="16" fill="#030712"/>
    
    <!-- Calculator Header Display -->
    <rect x="22" y="32" width="166" height="50" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="176" y="65" fill="#00D2FF" font-family="'Courier New', monospace" font-size="22" font-weight="bold" text-anchor="end">4,815,162.34</text>
    <text x="32" y="48" fill="#9CA3AF" font-family="sans-serif" font-size="9">SECURE VAULT [LOCKED]</text>

    <!-- Pin Pad / Calculator grid -->
    <g transform="translate(24, 96)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#374151"/><text x="18" y="23" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">C</text>
      <rect x="42" y="0" width="36" height="36" rx="8" fill="#374151"/><text x="60" y="23" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">±</text>
      <rect x="84" y="0" width="36" height="36" rx="8" fill="#374151"/><text x="102" y="23" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">%</text>
      <rect x="126" y="0" width="36" height="36" rx="8" fill="#FF5722"/><text x="144" y="23" fill="#FFF" font-family="sans-serif" font-size="16" text-anchor="middle">÷</text>

      <!-- Row 2 -->
      <rect x="0" y="42" width="36" height="36" rx="8" fill="#1F2937"/><text x="18" y="65" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">7</text>
      <rect x="42" y="42" width="36" height="36" rx="8" fill="#1F2937"/><text x="60" y="65" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">8</text>
      <rect x="84" y="42" width="36" height="36" rx="8" fill="#1F2937"/><text x="102" y="65" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">9</text>
      <rect x="126" y="42" width="36" height="36" rx="8" fill="#2563EB"/><text x="144" y="65" fill="#FFF" font-family="sans-serif" font-size="16" text-anchor="middle">×</text>

      <!-- Row 3 -->
      <rect x="0" y="84" width="36" height="36" rx="8" fill="#1F2937"/><text x="18" y="107" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">4</text>
      <rect x="42" y="84" width="36" height="36" rx="8" fill="#1F2937"/><text x="60" y="107" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">5</text>
      <rect x="84" y="84" width="36" height="36" rx="8" fill="#1F2937"/><text x="102" y="107" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">6</text>
      <rect x="126" y="84" width="36" height="36" rx="8" fill="#2563EB"/><text x="144" y="107" fill="#FFF" font-family="sans-serif" font-size="16" text-anchor="middle">−</text>

      <!-- Row 4 -->
      <rect x="0" y="126" width="36" height="36" rx="8" fill="#1F2937"/><text x="18" y="149" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">1</text>
      <rect x="42" y="126" width="36" height="36" rx="8" fill="#1F2937"/><text x="60" y="149" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">2</text>
      <rect x="84" y="126" width="36" height="36" rx="8" fill="#1F2937"/><text x="102" y="149" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">3</text>
      <rect x="126" y="126" width="36" height="36" rx="8" fill="#2563EB"/><text x="144" y="149" fill="#FFF" font-family="sans-serif" font-size="16" text-anchor="middle">+</text>

      <!-- Row 5 -->
      <rect x="0" y="168" width="78" height="28" rx="8" fill="#1F2937"/><text x="39" y="187" fill="#FFF" font-family="sans-serif" font-size="13" text-anchor="middle">0</text>
      <rect x="84" y="168" width="36" height="28" rx="8" fill="#1F2937"/><text x="102" y="187" fill="#FFF" font-family="sans-serif" font-size="13" text-anchor="middle">.</text>
      <rect x="126" y="168" width="36" height="28" rx="8" fill="#10B981"/><text x="144" y="187" fill="#FFF" font-family="sans-serif" font-size="16" text-anchor="middle">=</text>
    </g>
  </g>

  <!-- Title & Floating Badges -->
  <g transform="translate(35, 55)">
    <text x="0" y="24" fill="#00D2FF" font-family="Impact, Arial Black, sans-serif" font-size="28" letter-spacing="1">CALCRYPT</text>
    <text x="0" y="44" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">VAULT &amp; CRYPTO TOOL</text>
  </g>

  <g transform="translate(42, 230)" filter="url(#shadowC)">
    <rect width="130" height="42" rx="21" fill="#0A192F" stroke="#00D2FF" stroke-width="2"/>
    <text x="65" y="26" fill="#00D2FF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FLUTTER / DART</text>
  </g>

  <g transform="translate(425, 120)" filter="url(#shadowC)">
    <rect width="135" height="42" rx="21" fill="#FF5722" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="67" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">AES-256 VAULT</text>
  </g>
</svg>