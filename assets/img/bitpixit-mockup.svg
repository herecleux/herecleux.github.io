<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <filter id="shadowB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bitGrad)" rx="16"/>

  <circle cx="520" cy="80" r="130" fill="#EC4899" opacity="0.12" />
  <circle cx="80" cy="300" r="100" fill="#8B5CF6" opacity="0.15" />

  <!-- App Window Mockup -->
  <g transform="translate(100, 45)" filter="url(#shadowB)">
    <rect width="400" height="300" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- Top toolbar -->
    <rect width="400" height="36" rx="14" fill="#1E293B"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    
    <!-- Tool icons simulation -->
    <rect x="80" y="8" width="55" height="20" rx="5" fill="#334155"/>
    <text x="107" y="22" fill="#E2E8F0" font-family="sans-serif" font-size="10" text-anchor="middle">✂ Crop</text>
    <rect x="145" y="8" width="55" height="20" rx="5" fill="#334155"/>
    <text x="172" y="22" fill="#E2E8F0" font-family="sans-serif" font-size="10" text-anchor="middle">🎨 Filter</text>
    <rect x="210" y="8" width="55" height="20" rx="5" fill="#334155"/>
    <text x="237" y="22" fill="#E2E8F0" font-family="sans-serif" font-size="10" text-anchor="middle">🔍 Zoom</text>
    
    <!-- Export Button -->
    <rect x="310" y="7" width="75" height="22" rx="11" fill="#38BDF8"/>
    <text x="347" y="22" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">EXPORT</text>

    <!-- Canvas Workspace -->
    <g transform="translate(20, 52)">
      <!-- Checkerboard / transparency canvas -->
      <rect width="360" height="228" rx="8" fill="#1E293B"/>
      
      <!-- Graphic element inside canvas -->
      <circle cx="180" cy="114" r="70" fill="#6366F1" opacity="0.6"/>
      <polygon points="180,60 230,150 130,150" fill="#EC4899" opacity="0.75"/>
      <rect x="135" y="90" width="90" height="50" rx="6" fill="#00D2FF" opacity="0.8"/>
      
      <!-- Selection handles -->
      <rect x="125" y="80" width="110" height="70" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3"/>
      <rect x="122" y="77" width="6" height="6" fill="#38BDF8"/>
      <rect x="232" y="77" width="6" height="6" fill="#38BDF8"/>
      <rect x="122" y="147" width="6" height="6" fill="#38BDF8"/>
      <rect x="232" y="147" width="6" height="6" fill="#38BDF8"/>
      
      <!-- Color palette bar at bottom of canvas -->
      <g transform="translate(100, 195)">
        <circle cx="15" cy="12" r="9" fill="#EF4444"/>
        <circle cx="40" cy="12" r="9" fill="#F59E0B"/>
        <circle cx="65" cy="12" r="9" fill="#10B981"/>
        <circle cx="90" cy="12" r="9" fill="#38BDF8"/>
        <circle cx="115" cy="12" r="9" fill="#8B5CF6"/>
        <circle cx="140" cy="12" r="9" fill="#EC4899"/>
      </g>
    </g>
  </g>

  <!-- Title & Floating Tag -->
  <g transform="translate(30, 45)">
    <text x="0" y="24" fill="#FFFFFF" font-family="Impact, Arial Black, sans-serif" font-size="28" letter-spacing="1">BITPIXIT</text>
    <text x="0" y="44" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">IMAGE &amp; PIXEL UTILITY</text>
  </g>

  <g transform="translate(425, 235)" filter="url(#shadowB)">
    <rect width="135" height="42" rx="21" fill="#00D2FF" stroke="#0F172A" stroke-width="2"/>
    <text x="67" y="26" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">HIGH-RES EXPORT</text>
  </g>
</svg>