<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ootAppGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2140" />
      <stop offset="100%" stop-color="#241442" />
    </linearGradient>
    <filter id="shadowApp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#ootAppGrad)" rx="16"/>
  <circle cx="510" cy="300" r="140" fill="#FF7300" opacity="0.15" />
  <circle cx="90" cy="80" r="100" fill="#8B5CF6" opacity="0.12" />

  <!-- Phone Mockup -->
  <g transform="translate(195, 40)" filter="url(#shadowApp)">
    <rect width="210" height="325" rx="28" fill="#FFFFFF" stroke="#0B192C" stroke-width="4"/>
    <rect x="75" y="10" width="60" height="5" rx="2.5" fill="#0B192C" opacity="0.3"/>

    <!-- Screen -->
    <rect x="10" y="24" width="190" height="288" rx="18" fill="#F8FAFC"/>

    <!-- App Header -->
    <rect x="10" y="24" width="190" height="55" rx="18" fill="#FF7300"/>
    <text x="22" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="900">OOTLAH APP</text>
    <text x="22" y="66" fill="#FFF3E0" font-family="sans-serif" font-size="9">Find experiences nearby</text>
    <circle cx="180" cy="50" r="12" fill="#FFFFFF" opacity="0.2"/>

    <!-- Featured Experience Banner -->
    <g transform="translate(18, 88)">
      <rect width="174" height="90" rx="8" fill="#1E293B"/>
      <rect x="0" y="0" width="174" height="60" rx="8" fill="#F59E0B"/>
      <text x="10" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="900">DESERT SUNSET SAFARI</text>
      <text x="10" y="76" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">BD 30.00</text>
      <rect x="105" y="66" width="60" height="18" rx="9" fill="#FF7300"/>
      <text x="135" y="78" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">BOOK NOW</text>
    </g>

    <!-- Mini Cards Row -->
    <g transform="translate(18, 186)">
      <rect width="82" height="75" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="4" y="4" width="74" height="38" rx="4" fill="#0AA4C2"/>
      <text x="8" y="54" fill="#0F172A" font-family="sans-serif" font-size="8" font-weight="bold">Jet Ski</text>
      <text x="8" y="65" fill="#FF7300" font-family="sans-serif" font-size="8" font-weight="900">BD 20</text>

      <g transform="translate(90, 0)">
        <rect width="82" height="75" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="4" y="4" width="74" height="38" rx="4" fill="#8B5CF6"/>
        <text x="8" y="54" fill="#0F172A" font-family="sans-serif" font-size="8" font-weight="bold">Horse Ride</text>
        <text x="8" y="65" fill="#8B5CF6" font-family="sans-serif" font-size="8" font-weight="900">BD 15</text>
      </g>
    </g>

    <!-- Bottom Navigation Bar on phone -->
    <g transform="translate(10, 275)">
      <rect width="190" height="37" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="35" cy="18" r="8" fill="#FF7300"/>
      <circle cx="95" cy="18" r="8" fill="#CBD5E1"/>
      <circle cx="155" cy="18" r="8" fill="#CBD5E1"/>
    </g>
  </g>

  <!-- Left Floating Badge -->
  <g transform="translate(35, 120)" filter="url(#shadowApp)">
    <rect width="135" height="42" rx="21" fill="#FF7300" stroke="#FFFFFF" stroke-width="2"/>
    <text x="67" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">GOOGLE PLAY</text>
  </g>

  <!-- Right Floating Badge -->
  <g transform="translate(430, 220)" filter="url(#shadowApp)">
    <rect width="135" height="42" rx="21" fill="#0B192C" stroke="#00D2FF" stroke-width="2"/>
    <text x="67" y="26" fill="#00D2FF" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">TICKETING APP</text>
  </g>
</svg>