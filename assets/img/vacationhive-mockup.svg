<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vacGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
    <filter id="shadowV" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#vacGrad)" rx="16"/>

  <!-- Subtle circles -->
  <circle cx="90" cy="80" r="110" fill="#00D2FF" opacity="0.1" />
  <circle cx="510" cy="320" r="140" fill="#F59E0B" opacity="0.1" />

  <!-- Laptop / Browser Window Mockup -->
  <g transform="translate(90, 50)" filter="url(#shadowV)">
    <!-- Browser Window Frame -->
    <rect width="420" height="290" rx="14" fill="#FFFFFF" stroke="#0E2140" stroke-width="3"/>
    
    <!-- Browser Title Bar -->
    <rect width="420" height="32" rx="14" fill="#F1F5F9"/>
    <!-- Circles -->
    <circle cx="20" cy="16" r="5" fill="#EF4444"/>
    <circle cx="36" cy="16" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="16" r="5" fill="#10B981"/>
    
    <!-- Search Bar in browser -->
    <rect x="85" y="6" width="250" height="20" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="20" fill="#64748B" font-family="sans-serif" font-size="10">https://vacationhive.app/explore</text>

    <!-- Browser Body Content -->
    <g transform="translate(15, 45)">
      <!-- Hero Banner inside app -->
      <rect width="390" height="85" rx="8" fill="#0A192F"/>
      <text x="20" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="900">DISCOVER YOUR PERFECT GETAWAY</text>
      <text x="20" y="55" fill="#93C5FD" font-family="sans-serif" font-size="10">Curated stays, direct hosts, best price guarantee.</text>
      <!-- Small search input pill -->
      <rect x="20" y="62" width="180" height="16" rx="8" fill="#FFFFFF"/>
      <text x="32" y="74" fill="#64748B" font-family="sans-serif" font-size="8">🔍 Search destinations...</text>

      <!-- 3 Small Property Cards -->
      <!-- Card 1 -->
      <g transform="translate(0, 98)">
        <rect width="124" height="135" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
        <rect x="6" y="6" width="112" height="66" rx="6" fill="#0284C7"/>
        <text x="12" y="86" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Azure Cliff Villa</text>
        <text x="12" y="98" fill="#64748B" font-family="sans-serif" font-size="8">Siargao Island</text>
        <text x="12" y="122" fill="#0A192F" font-family="sans-serif" font-size="11" font-weight="900">$180<tspan font-size="8" fill="#64748B">/night</tspan></text>
        <circle cx="106" cy="118" r="8" fill="#FF5722"/>
        <text x="106" y="121" fill="#FFF" font-family="sans-serif" font-size="8" text-anchor="middle">★</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(133, 98)">
        <rect width="124" height="135" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
        <rect x="6" y="6" width="112" height="66" rx="6" fill="#0D9488"/>
        <text x="12" y="86" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Pine Mist Cabin</text>
        <text x="12" y="98" fill="#64748B" font-family="sans-serif" font-size="8">Baguio Heights</text>
        <text x="12" y="122" fill="#0A192F" font-family="sans-serif" font-size="11" font-weight="900">$120<tspan font-size="8" fill="#64748B">/night</tspan></text>
        <circle cx="106" cy="118" r="8" fill="#FF5722"/>
        <text x="106" y="121" fill="#FFF" font-family="sans-serif" font-size="8" text-anchor="middle">★</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(266, 98)">
        <rect width="124" height="135" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
        <rect x="6" y="6" width="112" height="66" rx="6" fill="#4F46E5"/>
        <text x="12" y="86" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Skyline Loft</text>
        <text x="12" y="98" fill="#64748B" font-family="sans-serif" font-size="8">BGC Metro</text>
        <text x="12" y="122" fill="#0A192F" font-family="sans-serif" font-size="11" font-weight="900">$95<tspan font-size="8" fill="#64748B">/night</tspan></text>
        <circle cx="106" cy="118" r="8" fill="#FF5722"/>
        <text x="106" y="121" fill="#FFF" font-family="sans-serif" font-size="8" text-anchor="middle">★</text>
      </g>
    </g>
  </g>

  <!-- Floating Sticker -->
  <g transform="translate(430, 25)" filter="url(#shadowV)">
    <rect width="135" height="38" rx="19" fill="#FF5722" stroke="#FFFFFF" stroke-width="2"/>
    <text x="67" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">REACT + VITE SPA</text>
  </g>
</svg>