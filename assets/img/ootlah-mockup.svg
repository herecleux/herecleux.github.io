<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ootGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2140" />
      <stop offset="100%" stop-color="#1B355A" />
    </linearGradient>
    <filter id="shadowOot" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#ootGrad)" rx="16"/>
  <circle cx="510" cy="90" r="140" fill="#FF7300" opacity="0.15" />
  <circle cx="80" cy="320" r="110" fill="#0AA4C2" opacity="0.15" />

  <!-- Browser Mockup -->
  <g transform="translate(85, 45)" filter="url(#shadowOot)">
    <rect width="430" height="300" rx="14" fill="#FFFFFF" stroke="#0B192C" stroke-width="3"/>
    
    <!-- Browser Top Bar -->
    <rect width="430" height="32" rx="14" fill="#F1F5F9"/>
    <circle cx="20" cy="16" r="5" fill="#EF4444"/>
    <circle cx="36" cy="16" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="16" r="5" fill="#10B981"/>
    
    <rect x="85" y="6" width="260" height="20" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="20" fill="#64748B" font-family="sans-serif" font-size="10">https://ootlah.com</text>

    <!-- Web Content -->
    <g transform="translate(15, 45)">
      <!-- Hero Banner inside site -->
      <rect width="400" height="95" rx="8" fill="#FF7300"/>
      <text x="20" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="900">BOOK THRILLING EXPERIENCES</text>
      <text x="20" y="58" fill="#FFF3E0" font-family="sans-serif" font-size="10">Desert Safaris · Water Sports · Theme Parks &amp; Day Trips in GCC</text>
      
      <!-- Search pill -->
      <rect x="20" y="68" width="220" height="18" rx="9" fill="#FFFFFF"/>
      <text x="32" y="81" fill="#64748B" font-family="sans-serif" font-size="8">🔍 What do you want to experience?</text>

      <!-- Activity cards row -->
      <g transform="translate(0, 108)">
        <!-- Activity 1 -->
        <g transform="translate(0, 0)">
          <rect width="126" height="125" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
          <rect x="6" y="6" width="114" height="60" rx="6" fill="#F59E0B"/>
          <text x="12" y="82" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Dune Buggy Safari</text>
          <text x="12" y="94" fill="#64748B" font-family="sans-serif" font-size="8">Bahrain Desert</text>
          <text x="12" y="114" fill="#FF7300" font-family="sans-serif" font-size="11" font-weight="900">BD 35<tspan font-size="8" fill="#64748B">/person</tspan></text>
        </g>

        <!-- Activity 2 -->
        <g transform="translate(137, 0)">
          <rect width="126" height="125" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
          <rect x="6" y="6" width="114" height="60" rx="6" fill="#0AA4C2"/>
          <text x="12" y="82" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Scuba &amp; Snorkel</text>
          <text x="12" y="94" fill="#64748B" font-family="sans-serif" font-size="8">Jarada Island</text>
          <text x="12" y="114" fill="#0AA4C2" font-family="sans-serif" font-size="11" font-weight="900">BD 25<tspan font-size="8" fill="#64748B">/person</tspan></text>
        </g>

        <!-- Activity 3 -->
        <g transform="translate(274, 0)">
          <rect width="126" height="125" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
          <rect x="6" y="6" width="114" height="60" rx="6" fill="#6366F1"/>
          <text x="12" y="82" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Karting Circuit</text>
          <text x="12" y="94" fill="#64748B" font-family="sans-serif" font-size="8">BIC Sakhir</text>
          <text x="12" y="114" fill="#6366F1" font-family="sans-serif" font-size="11" font-weight="900">BD 18<tspan font-size="8" fill="#64748B">/person</tspan></text>
        </g>
      </g>
    </g>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(425, 20)" filter="url(#shadowOot)">
    <rect width="140" height="38" rx="19" fill="#FF7300" stroke="#FFFFFF" stroke-width="2"/>
    <text x="70" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">GCC TOURISM HUB</text>
  </g>
</svg>